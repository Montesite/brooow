<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demonstração de Vitrine</title>
  <meta name="description" content="Vitrine online da Brooow Tecnologia & Outsourcing: equipamentos, planos de locação e suprimentos disponíveis.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#150C1E">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="logo.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --orange: #ED7D20;
      --orange-light: #FFA85C;
      --orange-dark: #C4650F;
      --purple: #6B2FA0;
      --black: #150C1E;
      --white: #FFFFFF;
      --header-height: 80px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: var(--black);
    }

    /* ===== HEADER (padrão do site) ===== */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      background: rgba(21, 12, 30, 0.97);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(237, 125, 32, 0.25);
      height: var(--header-height);
      display: flex;
      align-items: center;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo img { height: 58px; width: auto; }

    nav { display: flex; align-items: center; gap: 32px; }

    nav a {
      color: rgba(255,255,255,0.8);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.3px;
      transition: color 0.3s;
    }

    nav a:hover { color: var(--orange-light); }
    nav a.current { color: var(--orange-light); }

    .nav-cta {
      background: var(--orange) !important;
      color: var(--white) !important;
      padding: 10px 22px !important;
      border-radius: 6px;
      font-weight: 600 !important;
      transition: background 0.3s, transform 0.2s !important;
    }

    .nav-cta:hover { background: var(--orange-dark) !important; transform: translateY(-1px); }

    .menu-toggle { display: none; background: none; border: none; cursor: pointer; padding: 4px; }

    .menu-toggle span {
      display: block;
      width: 24px;
      height: 2px;
      background: var(--orange);
      margin: 5px 0;
      transition: all 0.3s;
    }

    .mobile-nav {
      display: none;
      position: fixed;
      top: var(--header-height);
      left: 0; right: 0;
      background: var(--black);
      padding: 20px 24px;
      z-index: 999;
      border-bottom: 1px solid rgba(237, 125, 32, 0.25);
      flex-direction: column;
      gap: 4px;
    }

    .mobile-nav.open { display: flex; }

    .mobile-nav a {
      color: rgba(255,255,255,0.8);
      text-decoration: none;
      font-size: 16px;
      font-weight: 500;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      transition: color 0.3s;
    }

    .mobile-nav a:hover { color: var(--orange-light); }

    @media (max-width: 1150px) {
      header nav:not(.mobile-nav) { gap: 18px; }
      header nav:not(.mobile-nav) a { font-size: 13px; }
      .nav-cta { padding: 9px 16px !important; }
    }

    @media (max-width: 900px) {
      header nav:not(.mobile-nav) { gap: 12px; }
      header nav:not(.mobile-nav) a { font-size: 12px; }
    }

    @media (max-width: 768px) {
      :root { --header-height: 68px; }
      header nav:not(.mobile-nav) { display: none; }
      .menu-toggle { display: block; }
      .logo img { height: 50px; }
    }

    @media (max-width: 480px) {
      :root { --header-height: 62px; }
      .logo img { height: 42px; }
    }

    /* ===== VITRINE (iframe) ===== */
    .vitrine-frame {
      display: block;
      width: 100%;
      border: none;
      margin-top: var(--header-height);
    }

    a:focus-visible, button:focus-visible {
      outline: 2px solid var(--orange);
      outline-offset: 3px;
    }

    .skip-link {
      position: absolute;
      top: -50px;
      left: 16px;
      z-index: 2000;
      background: var(--orange);
      color: var(--white);
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: top 0.25s ease;
    }
    .skip-link:focus { top: 16px; }

    /* ===== TRANSIÇÃO SUAVE ENTRE PÁGINAS (View Transitions API) ===== */
    @view-transition {
      navigation: auto;
    }

    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation-duration: 0.45s;
      animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
    }

    @media (prefers-reduced-motion: reduce) {
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation: none;
      }
    }
  </style>
</head>
<body>

  <a href="#vitrineFrame" class="skip-link">Pular para o conteúdo</a>

  <!-- HEADER -->
  <header>
    <div class="header-inner">
      <a href="index.html" class="logo" aria-label="Brooow Tecnologia & Outsourcing - início">
        <img src="logo.png" alt="Brooow Tecnologia & Outsourcing">
      </a>
      <nav aria-label="Navegação principal">
        <a href="index.html#sobre">Sobre</a>
        <a href="index.html#servicos">Serviços</a>
        <a href="index.html#diferenciais">Diferenciais</a>
        <a href="vitrine.html" class="current" aria-current="page">Vitrine</a>
        <a href="index.html#contato" class="nav-cta">Fale conosco</a>
      </nav>
      <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <!-- MOBILE NAV -->
  <nav class="mobile-nav" id="mobileNav" aria-label="Menu mobile">
    <a href="index.html#sobre">Sobre</a>
    <a href="index.html#servicos">Serviços</a>
    <a href="index.html#diferenciais">Diferenciais</a>
    <a href="vitrine.html" class="current" aria-current="page">Vitrine</a>
    <a href="index.html#contato">Fale conosco</a>
  </nav>

  <!-- VITRINE -->
  <iframe id="vitrineFrame" class="vitrine-frame" src="https://brooow.egestor.com.br/vitrine/" title="Vitrine online da Brooow Tecnologia & Outsourcing"></iframe>

  <script>
    /* ---- Menu mobile ---- */
    const btn = document.getElementById('menuToggle');
    const mNav = document.getElementById('mobileNav');

    btn.addEventListener('click', () => {
      const open = mNav.classList.toggle('open');
      btn.setAttribute('aria-expanded', open);
    });

    document.addEventListener('click', (e) => {
      if (!btn.contains(e.target) && !mNav.contains(e.target)) {
        mNav.classList.remove('open');
        btn.setAttribute('aria-expanded', 'false');
      }
    });

    /* ---- Iframe ocupa exatamente o espaço restante abaixo do header ---- */
    const header = document.querySelector('header');
    const frame = document.getElementById('vitrineFrame');

    function sizeFrame() {
      const headerHeight = header.offsetHeight;
      frame.style.height = (window.innerHeight - headerHeight) + 'px';
    }

    window.addEventListener('resize', sizeFrame, { passive: true });
    window.addEventListener('orientationchange', sizeFrame);
    window.addEventListener('load', sizeFrame);
    sizeFrame();
  </script>
</body>
</html>
